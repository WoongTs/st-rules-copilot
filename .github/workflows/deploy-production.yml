name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: st-rules-copilot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare existing production Worker configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'worker/wrangler.example.jsonc';
          const config = JSON.parse(readFileSync(path, 'utf8'));
          config.kv_namespaces = [
            { binding: 'APP_KV', id: '1bdd8e093d1b4c1b902e7c7629d47a37' },
            { binding: 'OAUTH_KV', id: '7437923b482741e8b4248fffe33de2ab' }
          ];
          config.ratelimits = [
            { name: 'PUBLIC_RESOURCE_RATE_LIMITER', namespace_id: '2026071401', simple: { limit: 30, period: 60 } },
            { name: 'SIDE_EFFECT_RATE_LIMITER', namespace_id: '2026071402', simple: { limit: 10, period: 60 } }
          ];
          config.vars = {
            SMARTTHINGS_API_BASE: 'https://api.smartthings.com/v1',
            GPT_ACTIONS_CLIENT_ID: 'o9gcWsQA4S0cUZaI',
            GPT_ACTIONS_REDIRECT_URIS: JSON.stringify([
              'https://chat.openai.com/aip/g-321b768f1ba4cf3048cf0fde0c41acd5df83d8ea/oauth/callback',
              'https://chatgpt.com/aip/g-321b768f1ba4cf3048cf0fde0c41acd5df83d8ea/oauth/callback'
            ])
          };
          writeFileSync('worker/wrangler.jsonc', JSON.stringify(config, null, 2));
          NODE
          cp worker/.dev.vars.example worker/.dev.vars
      - run: npm run check
      - name: Deploy Worker and frontend assets
        run: npm run deploy:production -w worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d3ebdd8ac4bb15460b0ab9f389b5cca9
